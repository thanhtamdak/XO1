<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Gamepad / Trophy icon -->
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="170" fill="#0f172a" opacity="0.4" />
    <!-- Golden Coin -->
    <circle cx="256" cy="256" r="130" fill="url(#coinGrad)" stroke="#fef9c3" stroke-width="8" />
    <!-- X and O pattern on coin -->
    <path d="M190 200 L230 240 M230 200 L190 240" stroke="#713f12" stroke-width="12" stroke-linecap="round" />
    <circle cx="310" cy="220" r="22" stroke="#713f12" stroke-width="10" fill="none" />
    <!-- VND symbol or Star -->
    <path d="M256 265 L270 305 L315 305 L278 330 L292 372 L256 346 L220 372 L234 330 L197 305 L242 305 Z" fill="#713f12" />
  </g>
</svg>
